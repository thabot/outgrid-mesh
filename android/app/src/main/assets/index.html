		<link rel="manifest" href="/manifest.json" />
		<script>
			// Detailed On-Screen Error Catcher & Diagnostic Probe
			var collectedErrors = [];

			function renderErrorBox() {
				var errBox = document.getElementById('debug-error-box');
				if (!errBox) {
					errBox = document.createElement('div');
					errBox.id = 'debug-error-box';
					errBox.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#090d16;color:#f87171;padding:20px;box-sizing:border-box;font-family:monospace;font-size:13px;overflow:auto;z-index:999999;border:3px solid #ef4444;word-break:break-all;';
					document.body ? document.body.appendChild(errBox) : document.documentElement.appendChild(errBox);
				}

				var logText = collectedErrors.join('\n---\n');

				errBox.innerHTML = '<h2 style="color:#f87171;margin-top:0;font-size:18px;">🚨 OutGrid Error Diagnostics</h2>' +
					'<div style="background:#1e293b;padding:10px;border-radius:6px;margin-bottom:12px;color:#94a3b8;font-size:11px;">' +
					'<b>Current URL:</b> ' + window.location.href + '<br>' +
					'<b>Origin:</b> ' + window.location.origin + '<br>' +
					'<b>UserAgent:</b> ' + navigator.userAgent + '<br>' +
					'<b>ReadyState:</b> ' + document.readyState +
					'</div>' +
					'<button id="copy-err-btn" style="background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;margin-bottom:14px;">📋 คัดลอก Error ทั้งหมด</button>' +
					'<div style="display:flex;flex-direction:column;gap:12px;">' +
					collectedErrors.map(function(item) {
						return '<div style="background:#131d2e;padding:12px;border-radius:6px;border-left:4px solid #ef4444;">' + item + '</div>';
					}).join('') +
					'</div>';

				var btn = document.getElementById('copy-err-btn');
				if (btn) {
					btn.onclick = function() {
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard.writeText(logText).then(function() {
								btn.innerText = '✅ คัดลอกเรียบร้อย!';
								setTimeout(function() { btn.innerText = '📋 คัดลอก Error ทั้งหมด'; }, 2000);
							});
						} else {
							prompt('กดคัดลอกข้อความด้านล่างนี้ได้เลยครับ:', logText);
						}
					};
				}
			}

			function logDiagnosticError(title, detail) {
				collectedErrors.push('<b>[' + title + ']</b><br>' + detail);
				renderErrorBox();
			}

			window.addEventListener('error', function(e) {
				var info = '<b>Message:</b> ' + e.message + '<br>' +
					'<b>Source:</b> ' + (e.filename || 'unknown') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + '<br>' +
					(e.error && e.error.stack ? '<pre style="background:#0f172a;color:#cbd5e1;padding:8px;border-radius:4px;overflow:auto;margin:6px 0;">' + e.error.stack + '</pre>' : '');
				logDiagnosticError('Global Error', info);

				// Probe failed script if URL is present
				if (e.filename) {
					probeUrl(e.filename);
				}
			});

			window.addEventListener('unhandledrejection', function(e) {
				var r = e.reason || {};
				var msg = r.message || String(r);
				var stack = r.stack || '';
				logDiagnosticError('Unhandled Promise Rejection', '<b>Reason:</b> ' + msg + (stack ? '<pre style="background:#0f172a;color:#cbd5e1;padding:8px;border-radius:4px;overflow:auto;margin:6px 0;">' + stack + '</pre>' : ''));

				// If failed dynamic module, extract URL and probe
				var match = msg.match(/https?:\/\/[^\s'"]+|file:\/\/[^\s'"]+/);
				if (match) {
					probeUrl(match[0]);
				}
			});

			function probeUrl(url) {
				logDiagnosticError('Probing URL', 'กำลังทดสอบ fetch ไปยัง: <br><code>' + url + '</code>');
				fetch(url)
					.then(function(res) {
						logDiagnosticError('Probe Result for ' + url,
							'<b>Status:</b> ' + res.status + ' ' + res.statusText + '<br>' +
							'<b>Type:</b> ' + res.type + '<br>' +
							'<b>Content-Type:</b> ' + res.headers.get('content-type')
						);
					})
					.catch(function(err) {
						logDiagnosticError('Probe Failed for ' + url,
							'<b>Fetch Error:</b> ' + (err.message || String(err)) + '<br>' +
							'<i>(บ่งชี้ว่าระบบบล็อกการเข้าถึงไฟล์นี้โดยตรง หรือไฟล์ไม่มีอยู่จริง)</i>'
						);
					});
			}

			// Fallback: If SvelteKit has not mounted within 3 seconds, show diagnostic warning
			setTimeout(function() {
				var appRoot = document.querySelector('.app-root');
				if (!appRoot && collectedErrors.length === 0) {
					logDiagnosticError(
						'SvelteKit Mount Timeout (3s)',
						'แอปไม่สามารถโหลด UI เข้าสู่หน้าจอได้ (SvelteKit ไม่ได้เริ่มทำงาน หรือไฟล์ JS หลักไม่ถูกเรียก)<br>' +
						'<b>Document ReadyState:</b> ' + document.readyState
					);
				}
			}, 3000);
		</script>

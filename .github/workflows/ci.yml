name: OutGrid Mesh Continuous Integration

on:
  push:
    branches:
      - uat
  pull_request:
    branches:
      - uat

jobs:
  quality-gate:
    name: "Phase 1 Quality Gate & Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (uat branch)
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: "Step 1: Pre-Commit AST Syntax Check"
        run: node scripts/checkSyntax.js

      - name: "Step 2: Pure Domain Core Boundary Isolation Check"
        run: bun test tests/unit/foundation/ArchitectureBoundary.test.ts

      - name: "Step 3: Run Full Core Automated Unit Test Suite"
        run: bun test tests/unit/

name: Deploy Web Dashboard PWA to GitHub Pages

on:
  push:
    branches:
      - uat
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: Build & Verify (runs on BOTH uat and main) ───────────────────────
  build:
    name: Build PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: bun install

      - name: Inject Build Version from package.json + git commit SHA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          echo "VITE_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VITE_APP_COMMIT=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "VITE_APP_BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "Building version: v${VERSION} (${COMMIT_SHA}) on ${BUILD_DATE}"

      - name: Build Web PWA Bundle for GitHub Pages
        run: BASE_PATH="/outgrid-mesh" bun run build
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_APP_COMMIT: ${{ env.VITE_APP_COMMIT }}
          VITE_APP_BUILD_DATE: ${{ env.VITE_APP_BUILD_DATE }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

  # ─── Job 2: Deploy to GitHub Pages (runs on main branch ONLY) ─────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

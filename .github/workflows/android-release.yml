name: Build and Release OutGrid Android APK

on:
  push:
    branches:
      - uat
      - main

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: bun install

      - name: Run Syntax Check Guard
        run: node scripts/checkSyntax.js

      - name: Run Unit & Integration Tests
        run: bun test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/outgrid-rescue-uat.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: outgrid-rescue-uat-apk
          path: dist-apk/outgrid-rescue-uat.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-uat
          name: OutGrid Rescue v1.1.0 (UAT Sideload APK)
          body: |
            ## 🚨 OutGrid Rescue v1.1.0 (Emergency Mesh APK)
            - **Protocol:** Thabot OutGrid Protocol (TOG v1.1)
            - **Branch:** `uat`
            - **Architecture:** Android Native 24/7 Background Mesh Service + BLE Coded PHY (S=8) + Wi-Fi P2P
            - **Zero Internet Dependency:** 100% Offline Communication & Sideloading
            
            ### 📥 Download
            Download the standalone APK below:
            - **[outgrid-rescue-uat.apk](outgrid-rescue-uat.apk)**
          files: dist-apk/outgrid-rescue-uat.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

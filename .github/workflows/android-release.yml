name: Build and Release OutGrid Android APK

on:
  push:
    branches:
      - uat
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_PLAY_SECRET: ${{ secrets.PLAY_STORE_JSON_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Release Metadata
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "apk_name=outgrid-mesh.apk" >> $GITHUB_OUTPUT
            echo "aab_name=outgrid-mesh.aab" >> $GITHUB_OUTPUT
            echo "release_tag=v1.1.0" >> $GITHUB_OUTPUT
            echo "release_title=OutGrid Mesh v1.1.0 (Official Production Release)" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "play_track=production" >> $GITHUB_OUTPUT
          else
            UAT_VERSION="v1.1.0-uat.${{ github.run_number }}"
            echo "env_name=uat" >> $GITHUB_OUTPUT
            echo "apk_name=outgrid-mesh-uat.apk" >> $GITHUB_OUTPUT
            echo "aab_name=outgrid-mesh-uat.aab" >> $GITHUB_OUTPUT
            echo "release_tag=${UAT_VERSION}" >> $GITHUB_OUTPUT
            echo "release_title=OutGrid Mesh ${UAT_VERSION} (UAT Build ${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "play_track=internal" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: bun install

      - name: Run Syntax Check Guard
        run: node scripts/checkSyntax.js

      - name: Run Unit & Integration Tests
        run: bun test

      - name: Inject Build Version Metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          echo "VITE_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VITE_APP_COMMIT=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "VITE_APP_BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "Prepared version v${VERSION} (${COMMIT_SHA})"

      - name: Build Web PWA Bundle (Android mode — relative paths)
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_APP_COMMIT: ${{ env.VITE_APP_COMMIT }}
          VITE_APP_BUILD_DATE: ${{ env.VITE_APP_BUILD_DATE }}
          VITE_ANDROID_BUILD: "true"

      - name: Bundle Leaflet Marker Icons into assets (offline)
        run: |
          mkdir -p build/_vendor
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" -o build/_vendor/marker-icon.png
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png" -o build/_vendor/marker-icon-2x.png
          curl -sL "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png" -o build/_vendor/marker-shadow.png

      - name: Copy Web Bundle into Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r build/* android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode Android Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided."
          fi

      - name: Build Android Artifacts with Gradle (AAB & APK)
        env:
          ANDROID_KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/release.keystore" ]; then
            echo "Building Release AAB & APK with Release Keystore..."
            gradle bundleRelease assembleRelease assembleDebug -PcustomVersionCode=${{ github.run_number }} --no-daemon --stacktrace
            mkdir -p ../dist-aab ../dist-apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist-aab/${{ steps.meta.outputs.aab_name }}
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/${{ steps.meta.outputs.apk_name }}
          else
            echo "No Release Keystore found; building Debug AAB & APK..."
            gradle bundleDebug assembleDebug -PcustomVersionCode=${{ github.run_number }} --no-daemon --stacktrace
            mkdir -p ../dist-aab ../dist-apk
            cp app/build/outputs/bundle/debug/app-debug.aab ../dist-aab/${{ steps.meta.outputs.aab_name }}
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/${{ steps.meta.outputs.apk_name }}
          fi

      - name: Upload AAB as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.aab_name }}
          path: dist-aab/${{ steps.meta.outputs.aab_name }}
          retention-days: 30

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: dist-apk/${{ steps.meta.outputs.apk_name }}
          retention-days: 30

      - name: Deploy to Google Play Console
        if: env.HAS_PLAY_SECRET == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: io.outgrid.mesh
          releaseFiles: dist-aab/${{ steps.meta.outputs.aab_name }}
          track: ${{ steps.meta.outputs.play_track }}
          status: completed

      - name: Create or Update Specific Build GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_title }}
          body: |
            ## 🚨 ${{ steps.meta.outputs.release_title }}
            - **Protocol:** Thabot OutGrid Protocol (TOG v1.1)
            - **Channel:** `${{ steps.meta.outputs.env_name }}`
            - **Architecture:** Android Native 24/7 Background Mesh Service + BLE Coded PHY (S=8) + Wi-Fi P2P
            - **Zero Internet Dependency:** 100% Offline Communication & Sideloading

            ### 📦 ดาวน์โหลด App Bundle (สำหรับ Google Play Console):
            - **[${{ steps.meta.outputs.aab_name }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.aab_name }})**

            ### 📥 ดาวน์โหลด APK (สำหรับติดตั้งบนเครื่องโดยตรง):
            - **[${{ steps.meta.outputs.apk_name }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.apk_name }})**

            > ⚠️ **ข้อควรระวัง:** ไฟล์นี้ไม่ได้อยู่ในโค้ดของ Repository — ต้องดาวน์โหลดผ่านลิงก์ด้านบน หรือจากแท็บ **Releases** เท่านั้น
          files: |
            dist-apk/${{ steps.meta.outputs.apk_name }}
            dist-aab/${{ steps.meta.outputs.aab_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Permanent Latest UAT Release (v1.1.0-uat)
        if: steps.meta.outputs.env_name == 'uat'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-uat
          name: OutGrid Mesh v1.1.0-uat (Latest UAT Bleeding-Edge Build)
          body: |
            ## 🧪 OutGrid Mesh Latest UAT Build (Bleeding-Edge)
            - **Protocol:** Thabot OutGrid Protocol (TOG v1.1)
            - **Channel:** `uat`
            - **Permanent Direct Download:** ลิงก์ดาวน์โหลดถาวรสำหรับ APK และ AAB ตัวล่าสุดจาก branch `uat`
            - **Source Run:** Build #${{ github.run_number }} (${{ steps.meta.outputs.release_tag }})

            ### 📦 ดาวน์โหลด AAB ล่าสุด (Google Play Bundle):
            **[outgrid-mesh-uat.aab](https://github.com/${{ github.repository }}/releases/download/v1.1.0-uat/outgrid-mesh-uat.aab)**

            ### 📥 ดาวน์โหลด APK ล่าสุด (Permanent Link):
            **[outgrid-mesh-uat.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0-uat/outgrid-mesh-uat.apk)**
          files: |
            dist-apk/${{ steps.meta.outputs.apk_name }}
            dist-aab/${{ steps.meta.outputs.aab_name }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


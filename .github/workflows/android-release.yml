name: Build and Release OutGrid Android APK

on:
  push:
    branches:
      - uat
      - main

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Release Metadata
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "apk_name=outgrid-mesh.apk" >> $GITHUB_OUTPUT
            echo "release_tag=v1.1.0" >> $GITHUB_OUTPUT
            echo "release_title=OutGrid Mesh v1.1.0 (Official Production Release)" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            UAT_VERSION="v1.1.0-uat.${{ github.run_number }}"
            echo "env_name=uat" >> $GITHUB_OUTPUT
            echo "apk_name=outgrid-mesh-uat.apk" >> $GITHUB_OUTPUT
            echo "release_tag=${UAT_VERSION}" >> $GITHUB_OUTPUT
            echo "release_title=OutGrid Mesh ${UAT_VERSION} (UAT Build ${{ github.run_number }})" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: bun install

      - name: Run Syntax Check Guard
        run: node scripts/checkSyntax.js

      - name: Run Unit & Integration Tests
        run: bun test

      - name: Build Web PWA Bundle
        run: bun run build

      - name: Copy Web Bundle into Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r build/* android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/${{ steps.meta.outputs.apk_name }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: dist-apk/${{ steps.meta.outputs.apk_name }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_title }}
          body: |
            ## 🚨 ${{ steps.meta.outputs.release_title }}
            - **Protocol:** Thabot OutGrid Protocol (TOG v1.1)
            - **Channel:** `${{ steps.meta.outputs.env_name }}`
            - **Architecture:** Android Native 24/7 Background Mesh Service + BLE Coded PHY (S=8) + Wi-Fi P2P
            - **Zero Internet Dependency:** 100% Offline Communication & Sideloading

            ### 📥 ดาวน์โหลด APK
            คลิกปุ่ม **Assets** ด้านล่าง หรือดาวน์โหลดโดยตรงจากลิงก์นี้:

            **[${{ steps.meta.outputs.apk_name }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${{ steps.meta.outputs.apk_name }})**

            > ⚠️ **ข้อควรระวัง:** ไฟล์นี้ไม่ได้อยู่ในโค้ดของ Repository — ต้องดาวน์โหลดผ่านลิงก์ด้านบน หรือจากแท็บ **Releases** เท่านั้น
          files: dist-apk/${{ steps.meta.outputs.apk_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
